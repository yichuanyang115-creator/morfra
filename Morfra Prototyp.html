    return Math.max(0, Math.min(100, n));
  }

  var BOARD_COLUMNS = ['名称', '优先级', '负责人', '创建时间', '截止日期', '停留天数', '总耗时', '进度'];

  /* 排序图标：三条递减长度的横杠，经典"排序/筛选"意象，跟阶段标题行
     里已有的其它线框图标同一套视觉语言 */
  var SORT_ICON_SVG = '<svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M4 6h12M6 10h8M8.5 14h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  var CHEV_DOWN_ICON_SVG = '<svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CHEV_UP_ICON_SVG = '<svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M5 12l5-5 5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* "手动/规则"这两个词用户不需要知道——面板里只有排序字段。拖一拖
     卡片，顺序就悄悄变成"手动"；面板一直显示的是拖之前选的那套字段，
     所以想恢复排序不用去猜该选哪个，点提示按钮就是照面板当前显示的
     字段重新排一遍。排序按钮的高亮代表"这个阶段不是默认排序"（拖过，
     或者选了不是"创建时间新的在前"的规则），面板只在展开时渲染，跟
     产出/任务 Tab 的点击展开面板同一套交互模式。 */
  function renderStageSortControl(stageKey) {
    var sort = stageSort(stageKey);
    var open = state.sortPanelOpenStage === stageKey;
    var html = '<div class="stage-sort" data-od-id="stage-sort-' + stageKey + '">';
    html += '<button type="button" class="stage-sort-btn' + (isStageSortCustomized(sort) ? ' active' : '') + '" data-toggle-sort-panel="' + stageKey + '" title="排序" aria-label="排序">' + SORT_ICON_SVG + '</button>';
    if (open) {
      html += '<div class="sort-panel" data-od-id="sort-panel-' + stageKey + '">';
      if (sort.mode === 'manual') {
        html += '<div class="sort-manual-hint"><span>已手动调整顺序</span><button type="button" class="sort-restore-btn" data-restore-sort="' + stageKey + '">恢复排序</button></div>';
      }
      html += sortFieldRowHtml(stageKey, 'primary', '主排序', sort.primary, sort.primaryDir);
      html += sortFieldRowHtml(stageKey, 'secondary', '次排序', sort.secondary, sort.secondaryDir, true);
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function sortFieldRowHtml(stageKey, slot, label, fieldVal, dirVal, allowNone) {
    var opts = (allowNone ? ['<option value=""' + (!fieldVal ? ' selected' : '') + '>不设置</option>'] : [])
      .concat(SORT_FIELDS.map(function (f) {
        return '<option value="' + f.key + '"' + (fieldVal === f.key ? ' selected' : '') + '>' + f.label + '</option>';
      })).join('');
    var dirDisabled = allowNone && !fieldVal;
    return '<div class="sort-field-row">' +
      '<span class="sort-field-label">' + label + '</span>' +
      '<select class="sort-field-select" data-set-sort-field="' + stageKey + ':' + slot + '">' + opts + '</select>' +
      '<button type="button" class="sort-dir-btn"' + (dirDisabled ? ' disabled' : '') + ' data-toggle-sort-dir="' + stageKey + ':' + slot + '" title="' + (dirVal === 'desc' ? '降序' : '升序') + '">' + (dirVal === 'desc' ? CHEV_DOWN_ICON_SVG : CHEV_UP_ICON_SVG) + '</button>' +
      '</div>';
  }

  function draftRowHtml(stageKey) {
    return '<div class="draft-row" data-draft-row="' + stageKey + '">' +
      '<div><input type="text" placeholder="需求名称，回车创建" data-draft-input="' + stageKey + '" data-od-id="draft-input-' + stageKey + '" /></div>' +
      '<div></div><div></div><div></div><div></div><div></div><div></div><div></div>' +
      '</div>';
  }

  function renderBoardView() {
    if (!getReqs().length) return emptyStateHtml('还没有需求，点"收集"阶段的新建按钮记录你的第一个想法');
    var html = '<div class="board-field-header" data-od-id="board-field-header">' +
      BOARD_COLUMNS.map(function (c, i) { return '<div class="' + (i === 0 ? 'fh-name' : 'fh-mono') + '">' + c + '</div>'; }).join('') +
      '</div>';
    STAGES.forEach(function (s) {
      var reqs = reqsByStage(s.key);
      var collapsed = !!state.collapsedStages[s.key];
      var draftOpen = state.draftStage === s.key;
      html += '<section class="stage-section' + (collapsed ? ' collapsed' : '') + '" data-stage-section="' + s.key + '">';
      html += '<div class="stage-head" data-od-id="stage-head-' + s.key + '">';
      html += '<button type="button" class="stage-chip" data-toggle-stage="' + s.key + '">' +
        '<svg class="icon icon-sm chev" viewBox="0 0 20 20" fill="none"><path d="M6 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '<span class="stage-name">' + s.label + '</span><span class="stage-count">' + reqs.length + '</span>' +
        '</button>';
      html += '<span class="stage-line"></span>';
      if (s.key === 'archive') {
        html += '<div class="stage-search" data-od-id="archive-search-wrap"><svg class="icon-sm" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/><path d="M17 17l-3.6-3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
          '<input type="text" placeholder="搜索归档需求…" value="' + esc(state.archiveSearch) + '" data-archive-search data-od-id="archive-search-input" /></div>';
      } else {
        html += renderStageSortControl(s.key);
        html += '<button type="button" class="quick-add-toggle" data-draft-toggle="' + s.key + '" data-od-id="quick-add-toggle-' + s.key + '" aria-label="新建需求"><svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>新建</button>';
      }
      html += '</div>';

      var visibleReqs = s.key === 'archive' ? filterArchive(reqs) : sortReqsForStage(reqs, s.key);
      var bodyRows = (draftOpen ? draftRowHtml(s.key) : '') +
        (s.key === 'archive' ? visibleReqs.map(archiveRowHtml).join('') : visibleReqs.map(function (r) { return reqRowHtml(r, s.key); }).join(''));

      if (visibleReqs.length === 0 && !draftOpen) {
        var emptyText = s.key === 'archive'
          ? (state.archiveSearch ? '没有匹配的归档需求' : '还没有归档的需求')
          : ('该阶段暂无需求' + (s.key === 'collect' ? '，点上方新建记录你的第一个想法' : ''));
        html += '<div class="stage-empty" data-drop-stage="' + s.key + '">' + emptyText + '</div>';
      } else {
        html += '<div class="stage-body" data-drop-stage="' + s.key + '">' + bodyRows + '</div>';
      }
      html += '</section>';
    });
    return html;
  }

  function filterArchive(reqs) {
    var sorted = reqs.slice().sort(function (a, b) {
      var ta = a.transitions.length ? a.transitions[a.transitions.length - 1].timestamp : a.createdAt;
      var tb = b.transitions.length ? b.transitions[b.transitions.length - 1].timestamp : b.createdAt;
      return tb.localeCompare(ta);
    });
    var q = (state.archiveSearch || '').trim().toLowerCase();
    if (!q) return sorted;
    return sorted.filter(function (r) { return r.name.toLowerCase().indexOf(q) !== -1; });
  }

  function archiveRowHtml(r) {
    var archTime = r.transitions.length ? r.transitions[r.transitions.length - 1].timestamp.slice(0, 10) : r.createdAt;
    return '<div class="req-row archive-row" data-req-id="' + r.id + '" data-od-id="archive-row-' + r.id + '">' +
      '<div class="col-name"><span>' + esc(r.name) + '</span></div>' +
      '<div class="col-sub">' + (r.closureType === 'abandoned' ? '废弃' : '完成') + '</div>' +
      '<div class="col-sub">' + fmtDate(archTime) + '</div>' +
      '</div>';
  }

  function emptyStateHtml(text) {
    return '<div class="empty-state"><svg class="icon empty-icon" style="width:32px;height:32px" viewBox="0 0 20 20" fill="none"><path d="M4 14.5V6a1 1 0 0 1 1-1h4l2 2h5a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z" stroke="currentColor" stroke-width="1.4"/></svg><p>' + esc(text) + '</p></div>';
  }

  /* ================= 详情面板 ================= */
  function renderDetail() {
    var req = state.selectedReqId ? findReq(state.selectedReqId) : null;
    if (!req) {
      detailInnerEl.innerHTML = '<div class="detail-empty"><svg class="icon" style="width:30px;height:30px;color:var(--border-strong)" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/></svg><p>选择一条需求查看详情</p></div>';
      return;
    }
    var html = '';
    html += '<div class="detail-header" data-od-id="detail-header">';
    html += '<input class="detail-title-input" value="' + esc(req.name) + '" data-edit-name="' + req.id + '" data-od-id="detail-title-input" />';
    html += '<button class="detail-header-btn" data-fullscreen-toggle data-od-id="detail-fullscreen-btn" aria-label="全屏">' + (state.detailMode === 'fullscreen'
      ? '<svg class="icon icon-sm" viewBox="0 0 20 20" fill="none"><path d="M8 12l-5 5M12 8l5-5M3 13v4h4M17 7V3h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      : '<svg class="icon icon-sm" viewBox="0 0 20 20" fill="none"><path d="M13 7h4V3M7 13H3v4M17 3l-5.5 5.5M3 17l5.5-5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>') + '</button>';
    html += '</div>';

    var slot = attrStageSlot(req);
    html += '<div class="attr-grid" data-od-id="detail-attrs">';
    html += attrRow('优先级', prioritySelectHtml(req));
    html += attrRow('负责人', '<input class="attr-text-input" value="' + esc(req.assignee) + '" placeholder="未指定" data-edit-field="' + req.id + ':assignee" data-od-id="attr-assignee" />');
    html += attrRow('来源', sourceSelectHtml(req));
    html += attrRow('进度', req.stage === 'archive'
      ? '<span class="attr-text-input readonly">' + (req.closureType === 'abandoned' ? '废弃' : '完成') + '</span>'
      : '<input type="number" min="0" max="100" class="attr-text-input" value="' + (req.progress == null ? '' : req.progress) + '" placeholder="未填写" data-edit-progress="' + req.id + '" data-od-id="attr-progress" />');
    html += attrRow('阶段', stageChipHtml(req));
    html += attrRow(slot.label, slot.valueHtml);
    html += attrRow('截止日期', '<input type="date" class="attr-text-input" value="' + esc(req.deadline) + '" data-edit-field="' + req.id + ':deadline" data-od-id="attr-deadline" />');
    html += attrRow('创建时间', '<span class="attr-text-input readonly">' + fmtDate(req.createdAt) + '</span>');
    html += '</div>';

    html += '<div class="tab-bar" role="tablist" data-od-id="detail-tabs">';
    html += '<div class="tab-bar-tabs">';
    /* role="tablist" 只包了容器，标签按钮和面板缺 role="tab"/aria-selected/
       role="tabpanel"/aria-controls——ARIA APG 的 tab 模式要求这一整套
       同时出现，只挂容器角色而不补齐子节点，屏幕阅读器只会报"列表"，
       听不出这是可切换的标签组，等于比完全不用 ARIA 更误导。这里补全
       整套关系。 */
    [['body', '正文'], ['produce', '产出'], ['tasks', '任务'], ['acceptance', '验收'], ['activity', '活动']].forEach(function (t) {
      var isActive = state.activeTab === t[0];
      html += '<button class="tab-btn' + (isActive ? ' active' : '') + '" role="tab" aria-selected="' + isActive + '" aria-controls="tab-panel-' + t[0] + '" id="tab-' + t[0] + '-btn" data-tab="' + t[0] + '" data-od-id="tab-' + t[0] + '">' + t[1] + '</button>';
    });
    html += '</div>';
    html += renderTabBarSlot(req);
    html += '</div>';

    html += '<div class="detail-scroll">';
    html += '<div class="tab-panel' + (state.activeTab === 'body' ? ' active' : '') + '" role="tabpanel" id="tab-panel-body" aria-labelledby="tab-body-btn" data-tab-panel="body">' + renderBodyTab(req) + '</div>';
    html += '<div class="tab-panel' + (state.activeTab === 'produce' ? ' active' : '') + '" role="tabpanel" id="tab-panel-produce" aria-labelledby="tab-produce-btn" data-tab-panel="produce">' + renderProduceTab(req) + '</div>';
    html += '<div class="tab-panel' + (state.activeTab === 'tasks' ? ' active' : '') + '" role="tabpanel" id="tab-panel-tasks" aria-labelledby="tab-tasks-btn" data-tab-panel="tasks">' + renderTasksTab(req) + '</div>';
    html += '<div class="tab-panel' + (state.activeTab === 'acceptance' ? ' active' : '') + '" role="tabpanel" id="tab-panel-acceptance" aria-labelledby="tab-acceptance-btn" data-tab-panel="acceptance">' + renderAcceptanceTab(req) + '</div>';
    html += '<div class="tab-panel' + (state.activeTab === 'activity' ? ' active' : '') + '" role="tabpanel" id="tab-panel-activity" aria-labelledby="tab-activity-btn" data-tab-panel="activity">' + renderActivityTab(req) + '</div>';
    html += '</div>';

    detailInnerEl.innerHTML = html;
    bindDetailEvents(req);
  }

  function attrRow(label, valueHtml) {
    return '<div class="attr-label">' + label + '</div><div class="attr-value">' + valueHtml + '</div>';
  }

  function prioritySelectHtml(req) {
    var opts = ['P0', 'P1', 'P2'].map(function (p) {
      return '<option value="' + p + '"' + (req.priority === p ? ' selected' : '') + '>' + p + '</option>';
    }).join('');
    return '<select class="attr-select" data-edit-field="' + req.id + ':priority" data-od-id="attr-priority">' + opts + '</select>';
  }

  function sourceSelectHtml(req) {
    var options = SOURCES.slice();
    if (req.source && options.indexOf(req.source) === -1) options.unshift(req.source);
    var opts = options.map(function (s) {
      return '<option value="' + esc(s) + '"' + (req.source === s ? ' selected' : '') + '>' + esc(s) + '</option>';
    }).join('');
    return '<select class="attr-select" data-edit-field="' + req.id + ':source" data-od-id="attr-source">' + opts + '</select>';
  }

  function stageChipHtml(req) {
    var options = STAGES.map(function (s) { return s.key; }).concat(['abandon']).filter(function (k) { return k !== req.stage; });
    var opts = options.map(function (k) {
      var label = k === 'abandon' ? '废弃' : STAGE_LABEL[k];
      return '<option value="' + k + '">' + label + '</option>';
    }).join('');
    return '<select class="attr-select" data-transition-select="' + req.id + '" data-od-id="attr-stage">' +
      '<option value="" selected disabled hidden>' + STAGE_LABEL[req.stage] + (req.closureType === 'abandoned' ? '（废弃）' : '') + '</option>' + opts + '</select>';
  }

  /* 属性栏"阶段专属槪位"：标签和内容随当前阶段换，槪位只读展示，
     可编辑的操作全部收口到对应 Tab（任务/验收/附件），避免在属性栏
     重复造一套操作入口 */
  function attrStageSlot(req) {
    if (req.stage === 'design') {
      var done = req.attachments.filter(function (a) { return a.checked; }).length;
      return { label: '产出', valueHtml: '<span class="attr-text-input readonly">' + done + '/' + req.attachments.length + '</span>' };
    }
    if (req.stage === 'dev') {
      var doneTasks = req.tasks.filter(function (t) { return t.status === 'done'; }).length;
      return { label: '任务', valueHtml: '<span class="attr-text-input readonly">' + doneTasks + '/' + req.tasks.length + '</span>' };
    }
    if (req.stage === 'verify') {
      var passed = req.acceptance.filter(function (a) { return a.result === '通过'; }).length;
      return { label: '验收', valueHtml: '<span class="attr-text-input readonly">' + passed + '/' + req.acceptance.length + '</span>' };
    }
    if (req.stage === 'release') {
      return { label: '方式', valueHtml: '<span class="attr-text-input readonly">' + (req.releaseMethod || '未设置') + '</span>' };
    }
    if (req.stage === 'archive') {
      return { label: '结果', valueHtml: '<span class="attr-text-input readonly">' + (req.closureType === 'abandoned' ? '废弃' : '完成') + '</span>' };
    }
    return { label: '—', valueHtml: '<span class="attr-text-input readonly">—</span>' };
  }

  var TEMPLATE_TAG_ICON_SVG = '<svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M4 4h6l6 6-6 6-6-6V4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="7.5" cy="7.5" r="1" fill="currentColor"/></svg>';
  var BACK_ICON_SVG = '<svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M12 4.5 6 10l6 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var PLUS_ICON_SVG = '<svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';

  /* Tab 栏右侧操作插槽：跟"正文/产出/任务/验收/活动"这一行标签齐平，
     贴最右侧。不是每个 Tab 都有内容——产出/任务/验收放"新建"图标按钮
     （hover 提示具体新建什么），正文放模板抽屉入口，活动暂时空着。
     这样"新建"类操作不用各自散落在内容区顶部或列表末尾，统一收口到
     一个固定位置，切 Tab 时找起来位置不变。 */
  function renderTabBarSlot(req) {
    if (state.activeTab === 'produce') {
      return '<div class="tab-bar-slot"><button type="button" class="tab-slot-btn" data-add-produce="' + req.id + '" title="新建产出" aria-label="新建产出">' + PLUS_ICON_SVG + '</button></div>';
    }
    if (state.activeTab === 'tasks') {
      return '<div class="tab-bar-slot"><button type="button" class="tab-slot-btn" data-toggle-task-draft title="添加任务" aria-label="添加任务">' + PLUS_ICON_SVG + '</button></div>';
    }
    if (state.activeTab === 'acceptance') {
      return '<div class="tab-bar-slot"><button type="button" class="tab-slot-btn" data-toggle-ac-draft title="添加验收标准" aria-label="添加验收标准">' + PLUS_ICON_SVG + '</button></div>';
    }
    if (state.activeTab === 'body') {
      return '<div class="tab-bar-slot">' + renderTemplateRail(req) + '</div>';
    }
    /* 活动 Tab 没有对应的新建/操作入口，但插槽本身（flex:none 固定宽度）
       不能跟着消失——.tab-bar-tabs 是 flex:1，插槽一消失就会把这块宽度
       吃掉，五个 Tab 按钮的宽度跟着跳动，切到活动 Tab 时看起来像"整体
       结构变了一下"。返回一个空的占位 div，保持布局宽度不变，右侧就是
       纯空白，不需要额外样式。 */
    return '<div class="tab-bar-slot"></div>';
  }

  /* 模板抽屉：贴在正文 Tab 标签行最右侧的一个小把手，鼠标移上去（或正在
     编辑某个模板时强制展开）才露出模板列表；列表态可以插入/新建/删除，
     点编辑图标切到编辑态——编辑态复用的就是正文自己的 block-editor
     组件，打字即所见，不需要另一套写法 */
  function renderTemplateRail(req) {
    var forceOpen = !!state.templateEditingId;
    var html = '<div class="template-rail' + (forceOpen ? ' pinned' : '') + '" data-od-id="template-rail">';
    html += '<button type="button" class="template-rail-handle" data-od-id="template-rail-handle" title="正文模板" aria-label="正文模板">' + TEMPLATE_TAG_ICON_SVG + '</button>';
    html += '<div class="template-rail-drawer" data-od-id="template-rail-drawer">';
    if (state.templateEditingId) {
      var tpl = state.bodyTemplates.filter(function (t) { return t.id === state.templateEditingId; })[0];
      if (tpl) {
        html += '<div class="tpl-editor-head">' +
          '<button type="button" class="tpl-back-btn" data-tpl-back aria-label="返回列表">' + BACK_ICON_SVG + '</button>' +
          '<input type="text" class="tpl-editor-name" value="' + esc(tpl.name) + '" data-tpl-edit-name="' + tpl.id + '" placeholder="模板名称" data-od-id="tpl-editor-name" />' +
          '</div>';
        html += '<div class="block-editor tpl-editor-body" contenteditable="true" data-tpl-edit-body="' + tpl.id + '" data-placeholder="写模板内容，跟正文一样的编辑方式…" data-od-id="tpl-editor-body">' + (tpl.body || '') + '</div>';
      }
    } else {
      html += '<div class="tpl-drawer-head">正文模板</div>';
      if (state.bodyTemplates.length) {
        html += '<div class="tpl-drawer-list">';
        state.bodyTemplates.forEach(function (t) {
          html += '<div class="tpl-drawer-row" data-od-id="tpl-drawer-row-' + t.id + '">' +
            '<button type="button" class="tpl-drawer-name" data-fill-template="' + req.id + ':' + t.id + '" data-od-id="tpl-insert-' + t.id + '">' + esc(t.name || '未命名模板') + '</button>' +
            '<button type="button" class="tpl-drawer-icon-btn" data-tpl-edit="' + t.id + '" aria-label="编辑模板">' + RENAME_ICON_SVG + '</button>' +
            '<button type="button" class="tpl-drawer-icon-btn" data-tpl-del="' + t.id + '" aria-label="删除模板">' + DELETE_ICON_SVG + '</button>' +
            '</div>';
        });
        html += '</div>';
      } else {
        html += '<div class="tpl-empty">还没有模板</div>';
      }
      html += '<button type="button" class="tpl-drawer-add" data-tpl-add><svg class="icon icon-sm" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>新建模板</button>';
    }
    html += '</div></div>';
    return html;
  }

  function renderBodyTab(req) {
    return '<div class="block-editor" contenteditable="true" data-body-editor="' + req.id + '" data-placeholder="写下需求描述，或从 Tab 栏右侧模板插入…">' + (req.body || '') + '</div>';
  }

  var BLOCK_ICON_SVG = '<svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M10 6.5v4M10 13.2h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/></svg>';

  /* 任务 / 验收标准现在是各自独立的 Tab，跟正文平级——原来"进度"Tab
     的三段 checklist 拆开后，设计交付物并入"产出"Tab（见 renderProduceTab），
     这里只剩任务和验收两类结构化清单。

     任务行现在分两行：第一行名称+状态+阻塞开关+删除，第二行负责人/
     截止日期/进度%——后三个字段以前创建后就永远锁死在默认值，现在
     都能编辑。负责人/截止日期点击才展开成输入框（平时是纯文字，
     不常改，不用一直占着输入框的视觉重量）；进度%直接是数字输入框
     （改动频繁，值得常驻可编辑）。

     "阻塞"不再挤在状态循环里（那个位置永远循环不到，是之前的真 bug）：
     现在是一个独立的轻量开关，可以在待开始/进行中/完成任意状态下叠加
     打开，勾了之后旁边露出一个可编辑的说明框，记录"为什么阻塞"。 */
  function renderTasksTab(req) {
    var html = '';
    if (req.tasks.length) {
      html += '<div class="tab-summary">' + req.tasks.filter(function (t) { return t.status === 'done'; }).length + '/' + req.tasks.length + ' 已完成</div>';
    }
    html += '<div class="task-list">';
    if (state.taskDraftOpen) {
      /* 新建走完整表单，没有单独的"创建"按钮——名称填了字，点哪儿（整块
         表单失焦）或按回车都直接创建；名称是空的，点哪儿/回车都不会
         创建，表单直接收起。负责人/截止日期/进度想填就填，不填就留空 */
      html += '<div class="task-draft-row" data-od-id="task-draft-row">';
      html += '<div class="task-draft-row-main">' +
        '<input type="text" class="task-name-input" placeholder="任务名称（必填），填完点其他地方或回车即创建" data-task-draft-input="name" data-od-id="task-draft-name" /></div>';
      html += '<div class="task-draft-row-meta">' +
        '<input type="text" class="task-meta-input" placeholder="负责人" data-task-draft-input="assignee" data-od-id="task-draft-assignee" />' +
        '<input type="date" class="task-meta-input" data-task-draft-input="deadline" data-od-id="task-draft-deadline" />' +
        '<input type="number" class="task-progress-input" min="0" max="100" placeholder="—" data-task-draft-input="progress" data-od-id="task-draft-progress" />%' +
        '</div>';
      html += '</div>';
    }
    req.tasks.forEach(function (t) {
      var editingAssignee = state.taskEditFieldOpenId === t.id + ':assignee';
      var editingDeadline = state.taskEditFieldOpenId === t.id + ':deadline';
      var noteOpen = state.taskBlockNoteOpenId === t.id;
      html += '<div class="task-row' + (t.blocked ? ' blocked' : '') + '" data-od-id="task-row-' + t.id + '">';
      html += '<div class="task-row-main">';
      html += '<input type="text" class="task-name-input" value="' + esc(t.name) + '" placeholder="任务名称" data-edit-task-name="' + req.id + ':' + t.id + '" data-od-id="task-name-' + t.id + '" />';
      html += '<button type="button" class="status-pill ' + t.status + '" data-cycle-task-status="' + req.id + ':' + t.id + '">' + TASK_STATUS_LABEL[t.status] + '</button>';
      html += '<button type="button" class="task-blocked-toggle' + (t.blocked ? ' active' : '') + '" aria-pressed="' + t.blocked + '" data-toggle-task-blocked="' + req.id + ':' + t.id + '" title="标记阻塞" aria-label="标记阻塞">' + BLOCK_ICON_SVG + '</button>';
      html += '<button type="button" class="task-row-del" data-del-task="' + req.id + ':' + t.id + '" aria-label="删除任务"><svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>';
      html += '</div>';
      html += '<div class="task-row-meta">';
      html += editingAssignee
        ? '<input type="text" class="task-meta-input" value="' + esc(t.assignee) + '" placeholder="负责人" data-edit-task-field="' + req.id + ':' + t.id + ':assignee" data-od-id="task-assignee-input-' + t.id + '" autofocus />'
        : '<button type="button" class="task-meta-btn" data-open-task-field="' + t.id + ':assignee" data-od-id="task-assignee-btn-' + t.id + '">' + esc(t.assignee || '未指定负责人') + '</button>';
      html += editingDeadline
        ? '<input type="date" class="task-meta-input" value="' + esc(t.deadline) + '" data-edit-task-field="' + req.id + ':' + t.id + ':deadline" data-od-id="task-deadline-input-' + t.id + '" autofocus />'
        : '<button type="button" class="task-meta-btn" data-open-task-field="' + t.id + ':deadline" data-od-id="task-deadline-btn-' + t.id + '">' + (t.deadline ? fmtDate(t.deadline) : '未设置截止日期') + '</button>';
      html += '<input type="number" class="task-progress-input" min="0" max="100" placeholder="—" value="' + (t.progress == null ? '' : t.progress) + '" data-edit-task-progress="' + req.id + ':' + t.id + '" data-od-id="task-progress-' + t.id + '" />%';
      html += '</div>';
      if (t.blocked) {
        html += noteOpen
          ? '<textarea class="task-block-note-input" placeholder="为什么阻塞？" data-edit-task-blocknote="' + req.id + ':' + t.id + '" data-od-id="task-blocknote-input-' + t.id + '" autofocus>' + esc(t.blockNote) + '</textarea>'
          : '<button type="button" class="task-block-note" data-open-task-blocknote="' + t.id + '" data-od-id="task-blocknote-btn-' + t.id + '">' + (t.blockNote ? esc(t.blockNote) : '点击说明阻塞原因…') + '</button>';
      }
      html += '</div>';
    });
    html += '</div>';
    if (!req.tasks.length && !state.taskDraftOpen) html += '<div class="empty-state" style="padding:20px 0"><p>还没有开发任务，点右上角 + 添加</p></div>';
    return html;
  }

  var AC_RESULTS = ['通过', '不通过', '未验证'];

  /* 验收 Tab —— 跟任务 Tab 同一套交互语言：
     - 新建走行内草稿行（不用 window.prompt），描述必填，其余没有额外字段
     - 描述创建后可以点击编辑，不用删了重建
     - 结果从"两个按钮+隐含未验证"改成三个都能点的明确按钮，未验证不再是
       "两个按钮都没亮"这种要靠猜的状态
     - 不通过时露出一个可点击展开的说明框，记录"为什么不通过"——跟任务
       Tab 的阻塞说明是同一套形态，都是"结果需要留痕，不能只留一个结论"
     - 补上删除入口 */
  function renderAcceptanceTab(req) {
    var html = '';
    if (req.acceptance.length) {
      html += '<div class="tab-summary">' + req.acceptance.filter(function (a) { return a.result === '通过'; }).length + '/' + req.acceptance.length + ' 通过</div>';
    }
    html += '<div class="ac-list">';
    if (state.acDraftOpen) {
      html += '<div class="ac-draft-row" data-od-id="ac-draft-row">' +
        '<input type="text" class="ac-desc-input" placeholder="验收标准描述（必填），填完点其他地方或回车即创建" data-ac-draft-input data-od-id="ac-draft-input" /></div>';
    }
    req.acceptance.forEach(function (a) {
      var editingDesc = state.acEditDescOpenId === a.id;
      var failNoteOpen = state.acFailNoteOpenId === a.id;
      html += '<div class="ac-row' + (a.result === '不通过' ? ' failed' : '') + '" data-od-id="ac-row-' + a.id + '">';
      html += '<div class="ac-row-main">';
      html += editingDesc
        ? '<input type="text" class="ac-desc-input" value="' + esc(a.desc) + '" placeholder="验收标准描述" data-edit-ac-desc="' + req.id + ':' + a.id + '" data-od-id="ac-desc-input-' + a.id + '" autofocus />'
        : '<button type="button" class="ac-desc-btn" data-open-ac-desc="' + a.id + '" data-od-id="ac-desc-btn-' + a.id + '">' + esc(a.desc) + '</button>';
      html += '<div class="ac-result-toggle">';
      AC_RESULTS.forEach(function (r) {
        html += '<button type="button" class="ac-btn' + (r === '不通过' ? ' fail' : r === '通过' ? ' pass' : ' neutral') + (a.result === r ? ' on' : '') + '" data-set-ac="' + req.id + ':' + a.id + ':' + r + '">' + r + '</button>';
      });
      html += '</div>';
      html += '<button type="button" class="ac-row-del" data-del-ac="' + req.id + ':' + a.id + '" aria-label="删除验收标准"><svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>';
      html += '</div>';
      if (a.result === '不通过') {
        html += failNoteOpen
          ? '<textarea class="ac-fail-note-input" placeholder="为什么不通过？" data-edit-ac-failnote="' + req.id + ':' + a.id + '" data-od-id="ac-failnote-input-' + a.id + '" autofocus>' + esc(a.failNote) + '</textarea>'
          : '<button type="button" class="ac-fail-note" data-open-ac-failnote="' + a.id + '" data-od-id="ac-failnote-btn-' + a.id + '">' + (a.failNote ? esc(a.failNote) : '点击说明不通过原因…') + '</button>';
      }
      html += '</div>';
    });
    html += '</div>';
    if (!req.acceptance.length && !state.acDraftOpen) html += '<div class="empty-state" style="padding:20px 0"><p>验收标准为空，点右上角 + 添加</p></div>';
    return html;
  }

  function produceAttachIconSvg(type) {
    if (type === 'link') return '<svg class="icon icon-sm" viewBox="0 0 20 20" fill="none"><path d="M8 12l4-4M7.5 9.5 6 11a2.5 2.5 0 0 0 3.5 3.5l1.8-1.8M12.5 10.5 14 9a2.5 2.5 0 0 0-3.5-3.5l-1.8 1.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
    return '<svg class="icon icon-sm" viewBox="0 0 20 20" fill="none"><path d="M5.5 3h6l3 3v10.5a1 1 0 0 1-1 1h-8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.4"/></svg>';
  }

  /* 产出 Tab：每条是一张独立卡片，勾选框 = "完成"标记（取代了之前
     单独的"核心交付物"标记，两者语义本来就重叠），名称可编辑，
     一张卡片最多挂一个附件（文件或链接，二选一，再挂新的会替换旧的）。
     勾选完成和有没有附件是两件独立的事，完成后附件区仍可继续编辑——
     不做互锁，个人使用的工具不需要这种限制。 */
  var UPLOAD_ICON_SVG = '<svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M10 13V4M6.5 7.5 10 4l3.5 3.5M4.5 15h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function renderProduceTab(req) {
    var html = '';
    req.attachments.forEach(function (a) {
      var attachOpen = state.produceAttachOpenId === a.id;
      html += '<div class="produce-card' + (a.checked ? ' checked' : '') + '" data-od-id="produce-card-' + a.id + '">';
      /* 第一行：勾选完成 + 名称 + 删卡——跟第二行的附件操作分开，
         名称输入框不再被附件挤宽度 */
      html += '<div class="produce-row-1">';
      html += '<button type="button" class="checkbox' + (a.checked ? ' checked' : '') + '" role="checkbox" aria-checked="' + a.checked + '" aria-label="' + (a.checked ? '标记为未完成' : '标记为完成') + '" data-toggle-produce-checked="' + req.id + ':' + a.id + '"><svg viewBox="0 0 20 20" fill="none"><path d="M4 10l4 4 8-8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
      html += '<input type="text" class="produce-name-input" value="' + esc(a.name) + '" placeholder="名称" data-edit-produce-name="' + req.id + ':' + a.id + '" data-od-id="produce-name-' + a.id + '" />';
      html += '<button type="button" class="produce-card-del" data-del-produce="' + req.id + ':' + a.id + '" aria-label="删除这条产出"><svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>';
      html += '</div>';
      /* 第二行：附件槽——单独一行，宽度是整张卡。点"附加"直接展开输入框
         （粘贴链接自动识别，回车即添加），旁边一个小上传图标按钮——去掉了
         "上传文件/粘贴链接"二选一菜单这一层中间点击 */
      html += '<div class="produce-row-2">';
      if (a.attach) {
        html += '<a class="produce-attach-chip" href="' + esc(a.attach.url) + '" target="_blank" rel="noopener" data-od-id="produce-attach-chip-' + a.id + '">' + produceAttachIconSvg(a.attach.type) + '<span>' + esc(a.attach.label || a.attach.url) + '</span></a>';
        html += '<button type="button" class="produce-attach-remove" data-remove-produce-attach="' + req.id + ':' + a.id + '" aria-label="移除附件（保留这条产出）"><svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>';
      } else if (attachOpen) {
        html += '<form class="produce-attach-inline" data-add-produce-link="' + req.id + ':' + a.id + '" data-od-id="produce-attach-inline-' + a.id + '">' +
          '<input type="text" placeholder="粘贴链接，回车添加" data-produce-link-input="' + a.id + '" autofocus />' +
          '<button type="button" class="produce-attach-upload-btn" data-upload-produce="' + req.id + ':' + a.id + '" title="上传文件" aria-label="上传文件">' + UPLOAD_ICON_SVG + '</button>' +
          '</form>';
      } else {
        html += '<button type="button" class="produce-attach-add" data-open-produce-attach="' + a.id + '"><svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M10 5v10M5 10h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>附加文件或链接</button>';
      }
      html += '</div>';
      html += '</div>';
    });
    if (!req.attachments.length) html += '<div class="empty-state" style="padding:20px 0"><p>还没有产出，点右上角 + 新建</p></div>';
    return html;
  }

  /* 活动 Tab：每个节点对应一次阶段流转（req.transitions），节点自带一条
     可点击展开编辑的"说明"（tr.note——为什么发生这次流转，跟任务 Tab 的
     阻塞说明同一套形态），下面挂着任意条评论（req.comments，按
     transitionId 关联，不再限定只能对最新节点评论）。节点右上角可删除
     整条流转记录（连带说明和评论一起删，危险操作，二次确认）。 */
  function renderActivityTab(req) {
    if (!req.transitions.length) {
      return '<div class="empty-state" style="padding:30px 0"><p>该需求还没有流转记录</p></div>';
    }
    var html = '<div class="timeline">';
    req.transitions.forEach(function (tr, idx) {
      var isCurrent = idx === req.transitions.length - 1;
      var noteEditing = state.activityNoteEditId === tr.id;
      var commentOpen = state.activityCommentOpenId === tr.id;
      html += '<div class="tl-node' + (isCurrent ? ' current' : '') + '" data-od-id="tl-node-' + tr.id + '"><div class="tl-dot"></div>';
      html += '<div class="tl-node-head"><span class="tl-stage">' + (tr.to === 'archive' && req.closureType === 'abandoned' ? '归档（废弃）' : STAGE_LABEL[tr.to]) + '</span><span class="tl-time">' + fmtDateTime(tr.timestamp) + ' · ' + esc(tr.by) + '</span><button type="button" class="tl-node-del" data-del-transition="' + req.id + ':' + tr.id + '" aria-label="删除该流转记录">' + DELETE_ICON_SVG + '</button></div>';
      html += noteEditing
        ? '<textarea class="tl-note-input" placeholder="补充这次流转的说明…" data-edit-tl-note="' + req.id + ':' + tr.id + '" data-od-id="tl-note-input-' + tr.id + '" autofocus>' + esc(tr.note || '') + '</textarea>'
        : '<button type="button" class="tl-note" data-open-tl-note="' + tr.id + '" data-od-id="tl-note-btn-' + tr.id + '">' + (tr.note ? esc(tr.note) : '点击添加说明…') + '</button>';
      var comments = req.comments.filter(function (c) { return c.transitionId === tr.id; });
      comments.forEach(function (c) {
        html += '<div class="tl-comment"><div class="tl-comment-meta">' + fmtDateTime(c.timestamp) + '</div>' + esc(c.content) + '</div>';
      });
      html += commentOpen
        ? '<form class="tl-comment-form" data-add-tl-comment="' + req.id + ':' + tr.id + '" data-od-id="tl-comment-form-' + tr.id + '"><input type="text" placeholder="写评论，回车发送" data-tl-comment-input="' + tr.id + '" autofocus /></form>'
        : '<button type="button" class="tl-comment-add-btn" data-open-tl-comment="' + tr.id + '" data-od-id="tl-comment-btn-' + tr.id + '">+ 评论</button>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  /* ================= 事件绑定：主内容区 ================= */
  function bindMainEvents() {
    viewContainerEl.querySelectorAll('[data-toggle-stage]').forEach(function (el) {
      el.addEventListener('click', function () {
        var k = el.getAttribute('data-toggle-stage');
        state.collapsedStages[k] = !state.collapsedStages[k];
        if (state.draftStage === k) state.draftStage = null;
        renderMain();
      });
    });

    /* 阶段胶囊上的 + ：在该阶段列表最上方插入一个跟需求行同网格的草稿行，
       自动聚焦名称输入。未输入内容时失焦/点别处/切换阶段/切换视图都会
       让草稿行消失，不写入任何数据——回车才真正创建。 */
    viewContainerEl.querySelectorAll('[data-draft-toggle]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var k = el.getAttribute('data-draft-toggle');
        state.draftStage = state.draftStage === k ? null : k;
        renderMain();
        if (state.draftStage === k) {
          var input = viewContainerEl.querySelector('[data-draft-input="' + k + '"]');
          if (input) setTimeout(function () { input.focus(); }, 0);
        }
      });
    });

    viewContainerEl.querySelectorAll('[data-draft-input]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { state.draftStage = null; renderMain(); return; }
        if (e.key !== 'Enter') return;
        var val = el.value;
        if (!val.trim()) return;
        var stageKey = el.getAttribute('data-draft-input');
        var req = createReq(stageKey, val);
        state.draftStage = null;
        renderMain();
        if (req) selectReq(req.id);
      });
      el.addEventListener('blur', function () {
        if (!el.value.trim()) { state.draftStage = null; renderMain(); }
      });
    });

    viewContainerEl.querySelectorAll('[data-req-id]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.closest('[data-edit-progress]') ||
            e.target.closest('[data-edit-release-method]') || e.target.closest('[data-edit-release-date]')) return;
        var id = el.getAttribute('data-req-id');
        selectReq(id);
        renderMain();
      });
    });

    viewContainerEl.querySelectorAll('[data-edit-progress]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      el.addEventListener('mousedown', function (e) { e.stopPropagation(); });
      var commit = function () {
        var req = findReq(el.getAttribute('data-edit-progress'));
        if (!req) return;
        req.progress = clampProgress(el.value);
        saveState();
        if (state.selectedReqId === req.id) renderDetail();
      };
      el.addEventListener('change', commit);
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.blur(); });
    });

    /* 发布阶段行内可编辑：方式下拉 + 日期选择器 */
    viewContainerEl.querySelectorAll('[data-edit-release-method]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      el.addEventListener('change', function () {
        var req = findReq(el.getAttribute('data-edit-release-method'));
        if (!req) return;
        req.releaseMethod = el.value;
        saveState();
      });
    });
    viewContainerEl.querySelectorAll('[data-edit-release-date]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      el.addEventListener('change', function () {
        var req = findReq(el.getAttribute('data-edit-release-date'));
        if (!req) return;
        req.releaseDate = el.value;
        saveState();
        renderMain();
      });
    });

    /* 归档区域搜索：输入即时过滤，不写入任何数据 */
    var archiveSearchInput = viewContainerEl.querySelector('[data-archive-search]');
    if (archiveSearchInput) {
      archiveSearchInput.addEventListener('click', function (e) { e.stopPropagation(); });
      archiveSearchInput.addEventListener('input', function () {
        state.archiveSearch = archiveSearchInput.value;
        renderMain();
        var refocus = viewContainerEl.querySelector('[data-archive-search]');
        if (refocus) { refocus.focus(); refocus.selectionStart = refocus.selectionEnd = refocus.value.length; }
      });
    }

    bindInlineOpEvents(viewContainerEl);

    /* 拖拽：同一个 dragstart 服务两种目的地——拖到别的阶段＝流转
       （走 transitionReq，不关心落点位置），拖到同一阶段的另一张卡片
       上＝调整手动顺序。用一条插入线表示"要插进这两张卡片之间"，跟
       "拖到整个阶段区域＝换阶段"的整块高亮反馈区分开。
       浏览器规范里 dataTransfer.getData() 在 dragover/dragenter 阶段
       读不出数据（安全限制，只有 dragstart 和 drop 才能真正读到）——
       之前在 dragover 里调它，拿到的永远是空字符串，导致行级判断提前
       return，事件从没被 preventDefault/stopPropagation，一路冒泡到
       阶段容器，看起来就是"整个阶段都高亮，排序不生效"。改成在
       dragstart 时把被拖需求 id 存到下面这个跟 bindMainEvents 同生命
       周期的变量里，dragover/drop 都读它，不再依赖 dataTransfer。 */
    var draggingReqId = null;
    function clearDropIndicators() {
      viewContainerEl.querySelectorAll('.drop-indicator-before, .drop-indicator-after').forEach(function (el) {
        el.classList.remove('drop-indicator-before', 'drop-indicator-after');
      });
    }

    viewContainerEl.querySelectorAll('.req-row[draggable="true"]').forEach(function (el) {
      el.addEventListener('dragstart', function (e) {
        draggingReqId = el.getAttribute('data-req-id');
        e.dataTransfer.setData('text/plain', draggingReqId);
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', function () {
        draggingReqId = null;
        el.classList.remove('dragging');
        clearDropIndicators();
      });
      el.addEventListener('dragover', function (e) {
        var draggedReq = findReq(draggingReqId);
        var targetReq = findReq(el.getAttribute('data-req-id'));
        if (!draggedReq || !targetReq || draggedReq.id === targetReq.id || draggedReq.stage !== targetReq.stage) return;
        e.preventDefault();
        e.stopPropagation();
        var before = (e.clientY - el.getBoundingClientRect().top) < el.getBoundingClientRect().height / 2;
        el.classList.toggle('drop-indicator-before', before);
        el.classList.toggle('drop-indicator-after', !before);
      });
      el.addEventListener('dragleave', function () {
        el.classList.remove('drop-indicator-before', 'drop-indicator-after');
      });
      el.addEventListener('drop', function (e) {
        var draggedReq = findReq(draggingReqId);
        var targetReq = findReq(el.getAttribute('data-req-id'));
        if (!draggedReq || !targetReq || draggedReq.id === targetReq.id) return;
        e.preventDefault();
        e.stopPropagation();
        clearDropIndicators();
        if (draggedReq.stage !== targetReq.stage) {
          transitionReq(draggedReq, targetReq.stage);
        } else {
          var before = (e.clientY - el.getBoundingClientRect().top) < el.getBoundingClientRect().height / 2;
          reorderManual(targetReq.stage, draggedReq.id, targetReq.id, before);
        }
        renderMain();
        if (state.selectedReqId === draggedReq.id) renderDetail();
      });
    });
    viewContainerEl.querySelectorAll('[data-drop-stage]').forEach(function (el) {
      el.addEventListener('dragover', function (e) { e.preventDefault(); el.classList.add('stage-drop-target'); });
      el.addEventListener('dragleave', function () { el.classList.remove('stage-drop-target'); });
      el.addEventListener('drop', function (e) {
        e.preventDefault();
        el.classList.remove('stage-drop-target');
        clearDropIndicators();
        var target = el.getAttribute('data-drop-stage');
        var req = findReq(draggingReqId);
        if (req && req.stage !== target) {
          transitionReq(req, target);
          renderMain();
          if (state.selectedReqId === req.id) renderDetail();
        }
      });
    });

    /* 排序面板：点入口切展开/收起，选主/次字段和方向；跟产出/任务 Tab
       的点击展开面板同一套点外部+Esc 收起交互。面板里不再有"手动/规则"
       切换——选字段（哪怕选的还是原来那个）或点"恢复排序"都会让该阶段
       退出手动态，改回按字段规则排 */
    viewContainerEl.querySelectorAll('[data-toggle-sort-panel]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var k = el.getAttribute('data-toggle-sort-panel');
        state.sortPanelOpenStage = state.sortPanelOpenStage === k ? null : k;
        renderMain();
      });
    });
    viewContainerEl.querySelectorAll('[data-restore-sort]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        stageSort(el.getAttribute('data-restore-sort')).mode = 'rule';
        saveState(); renderMain();
      });
    });
    viewContainerEl.querySelectorAll('[data-set-sort-field]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      el.addEventListener('change', function () {
        var parts = el.getAttribute('data-set-sort-field').split(':');
        var sort = stageSort(parts[0]);
        if (parts[1] === 'primary') sort.primary = el.value;
        else sort.secondary = el.value || null;
        sort.mode = 'rule';
        saveState(); renderMain();
      });
    });
    viewContainerEl.querySelectorAll('[data-toggle-sort-dir]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var parts = el.getAttribute('data-toggle-sort-dir').split(':');
        var sort = stageSort(parts[0]);
        var dirKey = parts[1] === 'primary' ? 'primaryDir' : 'secondaryDir';
        sort[dirKey] = sort[dirKey] === 'desc' ? 'asc' : 'desc';
        sort.mode = 'rule';
        saveState(); renderMain();
      });
    });
    if (state.sortPanelOpenStage) {
      var closeSortPanel = function (e) {
        if (e.target.closest && e.target.closest('[data-toggle-sort-panel], .sort-panel')) return;
        state.sortPanelOpenStage = null;
        renderMain();
      };
      document.addEventListener('click', closeSortPanel, { once: true });
      var escSortPanel = function (e) {
        if (e.key === 'Escape') { state.sortPanelOpenStage = null; renderMain(); }
      };
      document.addEventListener('keydown', escSortPanel, { once: true });
    }
  }

  /* 阶段内拖拽调顺序：以拖拽发生那一刻屏幕上显示的顺序（不管当时是
     手动还是按规则排的）为底子，把拖动项插到目标项前面/后面，其余项
     顺移，重新按 0..n-1 赋值 manualOrder，并把该阶段悄悄切成手动——
     用户不用先去面板里选"手动"才能拖，拖了就自动是手动 */
  function reorderManual(stageKey, draggedId, targetId, before) {
    var list = sortReqsForStage(reqsByStage(stageKey), stageKey);
    var dragged = list.filter(function (r) { return r.id === draggedId; })[0];
    if (!dragged) return;
    list = list.filter(function (r) { return r.id !== draggedId; });
    var targetIdx = -1;
    list.forEach(function (r, idx) { if (r.id === targetId) targetIdx = idx; });
    if (targetIdx === -1) list.push(dragged);
    else list.splice(before ? targetIdx : targetIdx + 1, 0, dragged);
    list.forEach(function (r, idx) { r.manualOrder = idx; });
    stageSort(stageKey).mode = 'manual';
    saveState();
  }

  var TASK_STATUS_ORDER = ['todo', 'progress', 'done'];

  function bindInlineOpEvents(root) {
    root.querySelectorAll('[data-cycle-task-status]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var parts = el.getAttribute('data-cycle-task-status').split(':');
        var req = findReq(parts[0]);
        var t = req.tasks.filter(function (x) { return x.id === parts[1]; })[0];
        if (!t) return;
        t.status = TASK_STATUS_ORDER[(TASK_STATUS_ORDER.indexOf(t.status) + 1) % TASK_STATUS_ORDER.length];
        if (t.status === 'done') t.progress = 100;
        saveState(); renderMain(); if (state.selectedReqId === req.id) renderDetail();
      });
    });
    /* 三个结果按钮都是明确可点的态，直接切到点的那个态——不再是"再点
       一次亮着的按钮退回未验证"，因为未验证现在自己就是一个可以直接点
       选的按钮，不需要靠"取消选中"这种间接方式回到它 */
    root.querySelectorAll('[data-set-ac]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var parts = el.getAttribute('data-set-ac').split(':');
        var req = findReq(parts[0]);
        var a = req.acceptance.filter(function (x) { return x.id === parts[1]; })[0];
        if (a) {
          a.result = parts[2];
          /* 切走"不通过"时只是隐藏说明框，不清空 failNote——万一是手滑
             点错，切回"不通过"时原因说明还在，不用重新写一遍 */
          if (a.result !== '不通过') state.acFailNoteOpenId = null;
          saveState(); renderMain(); if (state.selectedReqId === req.id) renderDetail();
        }
      });
    });
  }

  /* ================= 事件绑定：详情面板 ================= */
  function bindDetailEvents(req) {
    detailInnerEl.querySelector('[data-edit-name]').addEventListener('change', function (e) {
      req.name = e.target.value.trim() || req.name;
      saveState(); renderMain(); renderDetail();
    });
    detailInnerEl.querySelector('[data-fullscreen-toggle]').addEventListener('click', function () {
      state.detailMode = state.detailMode === 'fullscreen' ? 'expanded' : 'fullscreen';
      applyDetailMode(); renderPanelToggle(); renderMain(); renderDetail();
    });

    detailInnerEl.querySelectorAll('[data-edit-field]').forEach(function (el) {
      var handler = function (e) {
        var parts = el.getAttribute('data-edit-field').split(':');
        req[parts[1]] = e.target.value;
        saveState();
        if (parts[1] === 'priority') renderMain();
      };
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'blur', handler);
    });

    var progressField = detailInnerEl.querySelector('[data-edit-progress]');
    if (progressField) {
      progressField.addEventListener('change', function () {
        req.progress = clampProgress(progressField.value);
        saveState();
        renderMain();
      });
      progressField.addEventListener('keydown', function (e) { if (e.key === 'Enter') progressField.blur(); });
    }

    detailInnerEl.querySelector('[data-transition-select]').addEventListener('change', function (e) {
      var val = e.target.value;
      if (!val) return;
      if (val === 'abandon') transitionReq(req, 'archive', { abandoned: true });
      else transitionReq(req, val);
      renderMain(); renderDetail();
    });

    detailInnerEl.querySelectorAll('[data-tab]').forEach(function (el) {
      el.addEventListener('click', function () {
        state.activeTab = el.getAttribute('data-tab');
        state.produceAttachOpenId = null;
        state.templateEditingId = null;
        state.taskDraftOpen = false;
        state.taskEditFieldOpenId = null;
        state.taskBlockNoteOpenId = null;
        state.acDraftOpen = false;
        state.acEditDescOpenId = null;
        state.acFailNoteOpenId = null;
        state.activityNoteDraftAnchor = null;
        state.activityNoteEditId = null;
        state.activityCommentOpenId = null;
        renderDetail();
      });
    });

    var editor = detailInnerEl.querySelector('[data-body-editor]');
    if (editor) {
      editor.addEventListener('input', function () {
        req.body = editor.innerHTML;
        saveState();
        applyMarkdownLiteShortcut(editor);
      });
      /* 记住光标位置：点模板按钮的一瞬间编辑器会失焦，选区就没了，
         所以要在失焦前存一份，插入模板时再还原到这个位置 */
      editor.addEventListener('blur', function () { lastEditorRange = captureEditorRange(editor); });
      editor.addEventListener('keyup', function () { lastEditorRange = captureEditorRange(editor); });
      editor.addEventListener('mouseup', function () { lastEditorRange = captureEditorRange(editor); });
    }
    detailInnerEl.querySelectorAll('[data-fill-template]').forEach(function (el) {
      el.addEventListener('click', function () {
        var parts = el.getAttribute('data-fill-template').split(':');
        var tpl = state.bodyTemplates.filter(function (t) { return t.id === parts[1]; })[0];
        if (!tpl || !editor) return;
        insertHtmlAtRange(editor, tpl.body || '');
        req.body = editor.innerHTML;
        saveState();
      });
    });

    /* 模板抽屉：新建/编辑/删除，编辑态复用真正的 block-editor 组件 */
    var tplAddBtn = detailInnerEl.querySelector('[data-tpl-add]');
    if (tplAddBtn) tplAddBtn.addEventListener('click', function () {
      var tpl = { id: uid('tpl'), name: '未命名模板', body: '' };
      state.bodyTemplates.push(tpl);
      state.templateEditingId = tpl.id;
      saveState(); renderDetail();
      var nameInput = detailInnerEl.querySelector('[data-tpl-edit-name]');
      if (nameInput) { nameInput.focus(); nameInput.select(); }
    });
    detailInnerEl.querySelectorAll('[data-tpl-edit]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        state.templateEditingId = el.getAttribute('data-tpl-edit');
        renderDetail();
      });
    });
    detailInnerEl.querySelectorAll('[data-tpl-del]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = el.getAttribute('data-tpl-del');
        state.bodyTemplates = state.bodyTemplates.filter(function (t) { return t.id !== id; });
        saveState(); renderDetail();
      });
    });
    var tplBackBtn = detailInnerEl.querySelector('[data-tpl-back]');
    if (tplBackBtn) tplBackBtn.addEventListener('click', function () {
      state.templateEditingId = null;
      renderDetail();
    });
    var tplNameInput = detailInnerEl.querySelector('[data-tpl-edit-name]');
    if (tplNameInput) tplNameInput.addEventListener('input', function () {
      var tpl = state.bodyTemplates.filter(function (t) { return t.id === tplNameInput.getAttribute('data-tpl-edit-name'); })[0];
      if (tpl) { tpl.name = tplNameInput.value; saveState(); }
    });
    var tplBodyEditor = detailInnerEl.querySelector('[data-tpl-edit-body]');
    if (tplBodyEditor) tplBodyEditor.addEventListener('input', function () {
      var tpl = state.bodyTemplates.filter(function (t) { return t.id === tplBodyEditor.getAttribute('data-tpl-edit-body'); })[0];
      if (tpl) { tpl.body = tplBodyEditor.innerHTML; saveState(); }
      applyMarkdownLiteShortcut(tplBodyEditor);
    });

    bindInlineOpEvents(detailInnerEl);

    /* 任务 Tab：新建走完整表单的行内草稿行（跟产出卡片一致的交互语言，
       不再用浏览器原生 prompt）——名称必填，负责人/截止日期/进度都能
       在创建前一次填完，不填就留空，不强制。 */
    var taskDraftToggle = detailInnerEl.querySelector('[data-toggle-task-draft]');
    if (taskDraftToggle) taskDraftToggle.addEventListener('click', function () {
      state.taskDraftOpen = true;
      renderDetail();
      var nameInput = detailInnerEl.querySelector('[data-task-draft-input="name"]');
      if (nameInput) nameInput.focus();
    });
    var taskDraftRow = detailInnerEl.querySelector('[data-od-id="task-draft-row"]');
    if (taskDraftRow) {
      var draftNameInput = taskDraftRow.querySelector('[data-task-draft-input="name"]');
      /* 没有单独的"创建"按钮——名称有字，点哪儿（表单整体失焦）或回车
         都直接创建；名称是空的，点哪儿/回车都只是收起表单，不创建 */
      var resolveTaskDraft = function () {
        var name = draftNameInput.value.trim();
        state.taskDraftOpen = false;
        if (!name) { renderDetail(); return; }
        var assignee = taskDraftRow.querySelector('[data-task-draft-input="assignee"]').value.trim();
        var deadline = taskDraftRow.querySelector('[data-task-draft-input="deadline"]').value;
        var progress = clampProgress(taskDraftRow.querySelector('[data-task-draft-input="progress"]').value);
        req.tasks.push({ id: uid('t'), name: name, assignee: assignee, deadline: deadline, progress: progress == null ? 0 : progress, status: 'todo', blocked: false, blockNote: '' });
        saveState(); renderMain(); renderDetail();
      };
      taskDraftRow.addEventListener('click', function (e) { e.stopPropagation(); });
      taskDraftRow.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { state.taskDraftOpen = false; renderDetail(); return; }
        if (e.key === 'Enter') { e.preventDefault(); resolveTaskDraft(); }
      });
      /* 表单整体失去焦点（点了表单以外的任何地方）就落定这次新建的
         结果——有名称就创建，没名称就放弃，两种情况都不用额外点确认 */
      taskDraftRow.addEventListener('focusout', function (e) {
        if (taskDraftRow.contains(e.relatedTarget)) return;
        resolveTaskDraft();
      });
    }
    detailInnerEl.querySelectorAll('[data-edit-task-name]').forEach(function (el) {
      el.addEventListener('change', function () {
        var parts = el.getAttribute('data-edit-task-name').split(':');
        var t = req.tasks.filter(function (x) { return x.id === parts[1]; })[0];
        if (t) { t.name = el.value.trim() || t.name; saveState(); }
      });
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.blur(); });
    });
    detailInnerEl.querySelectorAll('[data-del-task]').forEach(function (el) {
      el.addEventListener('click', function () {
        var parts = el.getAttribute('data-del-task').split(':');
        req.tasks = req.tasks.filter(function (t) { return t.id !== parts[1]; });
        saveState(); renderMain(); renderDetail();
      });
    });
    detailInnerEl.querySelectorAll('[data-open-task-field]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        state.taskEditFieldOpenId = el.getAttribute('data-open-task-field');
        renderDetail();
      });
    });
    detailInnerEl.querySelectorAll('[data-edit-task-field]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      var commit = function () {
        var parts = el.getAttribute('data-edit-task-field').split(':');
        var t = req.tasks.filter(function (x) { return x.id === parts[1]; })[0];
        if (t) { t[parts[2]] = el.value.trim(); saveState(); renderMain(); }
        state.taskEditFieldOpenId = null;
        renderDetail();
      };
      el.addEventListener('change', commit);
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.blur(); });
    });
    detailInnerEl.querySelectorAll('[data-edit-task-progress]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      el.addEventListener('change', function () {
        var parts = el.getAttribute('data-edit-task-progress').split(':');
        var t = req.tasks.filter(function (x) { return x.id === parts[1]; })[0];
        if (t) { t.progress = clampProgress(el.value); saveState(); renderMain(); }
      });
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.blur(); });
    });
    detailInnerEl.querySelectorAll('[data-toggle-task-blocked]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var parts = el.getAttribute('data-toggle-task-blocked').split(':');
        var t = req.tasks.filter(function (x) { return x.id === parts[1]; })[0];
        if (!t) return;
        t.blocked = !t.blocked;
        if (!t.blocked) state.taskBlockNoteOpenId = null;
        saveState(); renderMain(); renderDetail();
      });
    });
    detailInnerEl.querySelectorAll('[data-open-task-blocknote]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        state.taskBlockNoteOpenId = el.getAttribute('data-open-task-blocknote');
        renderDetail();
        var noteInput = detailInnerEl.querySelector('[data-edit-task-blocknote]');
        if (noteInput) noteInput.focus();
      });
    });
    detailInnerEl.querySelectorAll('[data-edit-task-blocknote]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      var commit = function () {
        var parts = el.getAttribute('data-edit-task-blocknote').split(':');
        var t = req.tasks.filter(function (x) { return x.id === parts[1]; })[0];
        if (t) { t.blockNote = el.value.trim(); saveState(); }
        state.taskBlockNoteOpenId = null;
        renderDetail();
      };
      el.addEventListener('blur', commit);
      el.addEventListener('keydown', function (e) { if (e.key === 'Escape') { state.taskBlockNoteOpenId = null; renderDetail(); } });
    });
    /* 退出逻辑：负责人/日期编辑态、阻塞说明编辑态，点外部或 Esc 都要收起 */
    if (state.taskEditFieldOpenId || state.taskBlockNoteOpenId) {
      var closeTaskEdit = function (e) {
        if (e.target.closest && e.target.closest('[data-open-task-field], [data-edit-task-field], [data-open-task-blocknote], [data-edit-task-blocknote]')) return;
        state.taskEditFieldOpenId = null;
        state.taskBlockNoteOpenId = null;
        renderDetail();
      };
      document.addEventListener('click', closeTaskEdit, { once: true });
      var escTaskEdit = function (e) {
        if (e.key === 'Escape') { state.taskEditFieldOpenId = null; state.taskBlockNoteOpenId = null; renderDetail(); }
      };
      document.addEventListener('keydown', escTaskEdit, { once: true });
    }

    /* 验收 Tab：新建走行内草稿行（不用 window.prompt），描述必填；
       描述创建后可点击编辑；结果三态改成三个都能点的明确按钮；
       不通过时露出可点击展开的说明框，记录原因；补上删除入口 */
    var acDraftToggle = detailInnerEl.querySelector('[data-toggle-ac-draft]');
    if (acDraftToggle) acDraftToggle.addEventListener('click', function () {
      state.acDraftOpen = true;
      renderDetail();
      var input = detailInnerEl.querySelector('[data-ac-draft-input]');
      if (input) input.focus();
    });
    var acDraftInput = detailInnerEl.querySelector('[data-ac-draft-input]');
    if (acDraftInput) {
      acDraftInput.addEventListener('click', function (e) { e.stopPropagation(); });
      var resolveAcDraft = function () {
        var desc = acDraftInput.value.trim();
        state.acDraftOpen = false;
        if (!desc) { renderDetail(); return; }
        req.acceptance.push({ id: uid('ac'), desc: desc, result: '未验证', failNote: '' });
        saveState(); renderMain(); renderDetail();
      };
      acDraftInput.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { state.acDraftOpen = false; renderDetail(); return; }
        if (e.key === 'Enter') { e.preventDefault(); resolveAcDraft(); }
      });
      acDraftInput.addEventListener('blur', resolveAcDraft);
    }
    detailInnerEl.querySelectorAll('[data-open-ac-desc]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        state.acEditDescOpenId = el.getAttribute('data-open-ac-desc');
        renderDetail();
      });
    });
    detailInnerEl.querySelectorAll('[data-edit-ac-desc]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      var commit = function () {
        var parts = el.getAttribute('data-edit-ac-desc').split(':');
        var a = req.acceptance.filter(function (x) { return x.id === parts[1]; })[0];
        if (a) { a.desc = el.value.trim() || a.desc; saveState(); }
        state.acEditDescOpenId = null;
        renderDetail();
      };
      el.addEventListener('blur', commit);
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.blur(); });
    });
    detailInnerEl.querySelectorAll('[data-del-ac]').forEach(function (el) {
      el.addEventListener('click', function () {
        var parts = el.getAttribute('data-del-ac').split(':');
        req.acceptance = req.acceptance.filter(function (a) { return a.id !== parts[1]; });
        saveState(); renderMain(); renderDetail();
      });
    });
    detailInnerEl.querySelectorAll('[data-open-ac-failnote]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        state.acFailNoteOpenId = el.getAttribute('data-open-ac-failnote');
        renderDetail();
        var noteInput = detailInnerEl.querySelector('[data-edit-ac-failnote]');
        if (noteInput) noteInput.focus();
      });
    });
    detailInnerEl.querySelectorAll('[data-edit-ac-failnote]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      var commit = function () {
        var parts = el.getAttribute('data-edit-ac-failnote').split(':');
        var a = req.acceptance.filter(function (x) { return x.id === parts[1]; })[0];
        if (a) { a.failNote = el.value.trim(); saveState(); }
        state.acFailNoteOpenId = null;
        renderDetail();
      };
      el.addEventListener('blur', commit);
      el.addEventListener('keydown', function (e) { if (e.key === 'Escape') { state.acFailNoteOpenId = null; renderDetail(); } });
    });
    /* 退出逻辑：描述编辑态、不通过说明编辑态，点外部或 Esc 都要收起 */
    if (state.acEditDescOpenId || state.acFailNoteOpenId) {
      var closeAcEdit = function (e) {
        if (e.target.closest && e.target.closest('[data-open-ac-desc], [data-edit-ac-desc], [data-open-ac-failnote], [data-edit-ac-failnote]')) return;
        state.acEditDescOpenId = null;
        state.acFailNoteOpenId = null;
        renderDetail();
      };
      document.addEventListener('click', closeAcEdit, { once: true });
      var escAcEdit = function (e) {
        if (e.key === 'Escape') { state.acEditDescOpenId = null; state.acFailNoteOpenId = null; renderDetail(); }
      };
      document.addEventListener('keydown', escAcEdit, { once: true });
    }

    /* 产出 Tab：新建卡片、改名、勾选完成、挂/移除附件——完成状态和
       附件是两件独立的事，勾选后附件区照样能继续加/换/删，不锁定 */
    var addProduce = detailInnerEl.querySelector('[data-add-produce]');
    if (addProduce) addProduce.addEventListener('click', function () {
      req.attachments.unshift({ id: uid('a'), name: '', checked: false, attach: null, createdAt: todayIso(), createdBy: '我' });
      saveState(); renderMain(); renderDetail();
      var input = detailInnerEl.querySelector('[data-edit-produce-name="' + req.id + ':' + req.attachments[0].id + '"]');
      if (input) { input.focus(); }
    });
    detailInnerEl.querySelectorAll('[data-edit-produce-name]').forEach(function (el) {
      el.addEventListener('change', function () {
        var parts = el.getAttribute('data-edit-produce-name').split(':');
        var a = req.attachments.filter(function (x) { return x.id === parts[1]; })[0];
        if (a) { a.name = el.value.trim(); saveState(); renderMain(); }
      });
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.blur(); });
    });
    detailInnerEl.querySelectorAll('[data-toggle-produce-checked]').forEach(function (el) {
      el.addEventListener('click', function () {
        var parts = el.getAttribute('data-toggle-produce-checked').split(':');
        var a = req.attachments.filter(function (x) { return x.id === parts[1]; })[0];
        if (a) { a.checked = !a.checked; saveState(); renderMain(); renderDetail(); }
      });
    });
    detailInnerEl.querySelectorAll('[data-del-produce]').forEach(function (el) {
      el.addEventListener('click', function () {
        var parts = el.getAttribute('data-del-produce').split(':');
        req.attachments = req.attachments.filter(function (a) { return a.id !== parts[1]; });
        saveState(); renderMain(); renderDetail();
      });
    });
    /* 附加交互：点"附加文件或链接"直接展开输入框（不再经过上传/链接
       二选一菜单），粘贴链接回车即添加，旁边小图标按钮走上传 */
    detailInnerEl.querySelectorAll('[data-open-produce-attach]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        state.produceAttachOpenId = el.getAttribute('data-open-produce-attach');
        renderDetail();
        var input = detailInnerEl.querySelector('[data-produce-link-input]');
        if (input) input.focus();
      });
    });
    detailInnerEl.querySelectorAll('[data-upload-produce]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var parts = el.getAttribute('data-upload-produce').split(':');
        var a = req.attachments.filter(function (x) { return x.id === parts[1]; })[0];
        if (a) { a.attach = { type: 'file', url: '#', label: '需求说明-' + Math.floor(Math.random() * 900 + 100) + '.pdf' }; }
        state.produceAttachOpenId = null;
        saveState(); renderDetail();
      });
    });
    detailInnerEl.querySelectorAll('[data-add-produce-link]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      el.addEventListener('submit', function (e) {
        e.preventDefault();
        var parts = el.getAttribute('data-add-produce-link').split(':');
        var input = el.querySelector('[data-produce-link-input]');
        var val = input.value.trim();
        if (!val) return;
        var a = req.attachments.filter(function (x) { return x.id === parts[1]; })[0];
        if (a) a.attach = { type: 'link', url: val };
        state.produceAttachOpenId = null;
        saveState(); renderDetail();
      });
    });
    detailInnerEl.querySelectorAll('[data-remove-produce-attach]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.preventDefault();
        var parts = el.getAttribute('data-remove-produce-attach').split(':');
        var a = req.attachments.filter(function (x) { return x.id === parts[1]; })[0];
        if (a) a.attach = null;
        saveState(); renderDetail();
      });
    });
    /* 退出逻辑：附加输入框展开后，点击它自身以外的任何地方，或按 Esc，
       都要收起——之前这里完全没有关闭机制，是个真 bug */
    if (state.produceAttachOpenId) {
      var closeProduceAttach = function (e) {
        if (e.target.closest && e.target.closest('[data-open-produce-attach], [data-add-produce-link]')) return;
        state.produceAttachOpenId = null;
        renderDetail();
      };
      document.addEventListener('click', closeProduceAttach, { once: true });
      var escProduceAttach = function (e) {
        if (e.key === 'Escape') { state.produceAttachOpenId = null; renderDetail(); }
      };
      document.addEventListener('keydown', escProduceAttach, { once: true });
    }

    /* 活动 Tab：说明——常态是一行灰字按钮，点击展开成小文本框，跟任务
       Tab 的阻塞说明同一套形态；blur/Enter 提交，Esc 取消不保存 */
    detailInnerEl.querySelectorAll('[data-open-tl-note]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        state.activityNoteEditId = el.getAttribute('data-open-tl-note');
        renderDetail();
        var noteInput = detailInnerEl.querySelector('[data-edit-tl-note]');
        if (noteInput) noteInput.focus();
      });
    });
    detailInnerEl.querySelectorAll('[data-edit-tl-note]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      var commit = function () {
        var parts = el.getAttribute('data-edit-tl-note').split(':');
        var tr = req.transitions.filter(function (x) { return x.id === parts[1]; })[0];
        if (tr) { tr.note = el.value.trim(); saveState(); }
        state.activityNoteEditId = null;
        renderDetail();
      };
      el.addEventListener('blur', commit);
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { state.activityNoteEditId = null; renderDetail(); }
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.blur(); }
      });
    });

    /* 活动 Tab：对任意节点评论——点"+ 评论"展开输入框，回车发送并收起 */
    detailInnerEl.querySelectorAll('[data-open-tl-comment]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        state.activityCommentOpenId = el.getAttribute('data-open-tl-comment');
        renderDetail();
        var input = detailInnerEl.querySelector('[data-tl-comment-input]');
        if (input) input.focus();
      });
    });
    detailInnerEl.querySelectorAll('[data-add-tl-comment]').forEach(function (form) {
      form.addEventListener('click', function (e) { e.stopPropagation(); });
      form.addEventListener('submit', function (e) { e.preventDefault(); });
      var input = form.querySelector('[data-tl-comment-input]');
      var submit = function () {
        var parts = form.getAttribute('data-add-tl-comment').split(':');
        var trId = parts[1];
        var val = input.value.trim();
        state.activityCommentOpenId = null;
        if (!val) { renderDetail(); return; }
        req.comments.push({ id: uid('c'), transitionId: trId, content: val, timestamp: new Date().toISOString().slice(0, 16) });
        saveState(); renderDetail();
      };
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
        if (e.key === 'Escape') { state.activityCommentOpenId = null; renderDetail(); }
      });
      input.addEventListener('blur', function () {
        if (!input.value.trim()) { state.activityCommentOpenId = null; renderDetail(); }
      });
    });

    /* 退出逻辑：说明编辑态、评论输入态，点外部要收起（Esc 已在各自输入框上处理） */
    if (state.activityNoteEditId || state.activityCommentOpenId) {
      var closeActivityEdit = function (e) {
        if (e.target.closest && e.target.closest('[data-open-tl-note], [data-edit-tl-note], [data-open-tl-comment], [data-add-tl-comment]')) return;
        state.activityNoteEditId = null;
        state.activityCommentOpenId = null;
        renderDetail();
      };
      document.addEventListener('click', closeActivityEdit, { once: true });
    }

    /* 删除流转节点：连带这个节点下的说明和评论一起删，是危险操作，走
       二次确认弹窗（跟删除项目同一套 showConfirm） */
    detailInnerEl.querySelectorAll('[data-del-transition]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var parts = el.getAttribute('data-del-transition').split(':');
        var trId = parts[1];
        showConfirm('删除这条流转记录？', '该节点的说明和评论会一并删除，此操作无法撤销。', function () {
          req.transitions = req.transitions.filter(function (t) { return t.id !== trId; });
          req.comments = req.comments.filter(function (c) { return c.transitionId !== trId; });
          saveState(); renderMain(); renderDetail();
        });
      });
    });
  }

  /* ================= 全局事件：顶部条 · 项目切换 / 搜索 / 设置 ================= */
  function bindGlobalEvents() {
    var overlay = document.getElementById('overlay');
    function closePopovers() {
      document.getElementById('proj-popover').hidden = true;
      overlay.hidden = true;
      state.renamingProjectId = null;
    }
    overlay.addEventListener('click', closePopovers);

    document.getElementById('topbar-project').addEventListener('click', function (e) {
      e.stopPropagation();
      var pop = document.getElementById('proj-popover');
      if (!pop.hidden) { closePopovers(); return; }
      renderProjectPopover();
      pop.hidden = false;
      overlay.hidden = false;
    });

    /* 搜索是顶部条常驻控件（不再是可展开的悬浮面板），输入即出结果，
       结果渲染进搜索框正下方的内嵌下拉里 */
    var searchInput = document.getElementById('topbar-search-input');
    var searchDropdown = document.getElementById('topbar-search-dropdown');
    searchInput.addEventListener('click', function (e) { e.stopPropagation(); });
    searchInput.addEventListener('focus', renderTopbarSearchResults);
    searchInput.addEventListener('input', renderTopbarSearchResults);
    document.addEventListener('click', function () { searchDropdown.hidden = true; });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closePopovers(); searchDropdown.hidden = true; }
    });

    window.__closePopovers = closePopovers;
  }

  function renderTopbarSearchResults() {
    var searchInput = document.getElementById('topbar-search-input');
    var dropdown = document.getElementById('topbar-search-dropdown');
    var q = searchInput.value.trim().toLowerCase();
    if (!q) { dropdown.hidden = true; return; }
    var matches = getReqs().filter(function (r) { return r.name.toLowerCase().indexOf(q) !== -1; });
    dropdown.innerHTML = matches.length
      ? matches.map(function (r) {
          return '<div class="search-result-item" data-jump-req="' + r.id + '"><span class="sr-name">' + esc(r.name) + '</span><span class="sr-stage">' + STAGE_LABEL[r.stage] + '</span></div>';
        }).join('')
      : '<div class="search-empty">没有找到匹配的需求</div>';
    dropdown.hidden = false;
    dropdown.querySelectorAll('[data-jump-req]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var r = findReq(el.getAttribute('data-jump-req'));
        dropdown.hidden = true;
        searchInput.value = '';
        if (r.stage === 'archive') state.archiveSearch = '';
        if (state.collapsedStages[r.stage]) state.collapsedStages[r.stage] = false;
        selectReq(r.id);
        renderMain();
      });
    });
  }

  /* 干净的方形铅笔轮廓（笔身矩形 + 削尖三角 + 底部笔尖点），比一笔连画的
     铅笔形状在 14px 小尺寸下更容易辨认 */
  var RENAME_ICON_SVG = '<svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M4 16l.7-3L13.3 4.4a1 1 0 0 1 1.4 0l1 1a1 1 0 0 1 0 1.4L7.1 15.3 4 16Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M11.7 6l2.3 2.3" stroke="currentColor" stroke-width="1.4"/></svg>';
  var DELETE_ICON_SVG = '<svg class="icon-sm" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

  function renderProjectPopover() {
    var pop = document.getElementById('proj-popover');
    var html = '';
    state.projects.forEach(function (p) {
      var isActive = p.id === state.currentProjectId;
      var isRenaming = state.renamingProjectId === p.id;
      var nameCell = isRenaming
        ? '<input type="text" class="pop-rename-input" value="' + esc(p.name) + '" data-rename-input="' + p.id + '" data-od-id="pop-rename-input-' + p.id + '" />'
        : '<span class="pop-name">' + esc(p.name) + '</span>';
      var actions = isRenaming ? '' : (
        '<span class="pop-actions">' +
        '<button type="button" class="pop-action-btn" data-rename-project="' + p.id + '" aria-label="重命名项目">' + RENAME_ICON_SVG + '</button>' +
        (state.projects.length > 1 ? '<button type="button" class="pop-action-btn danger" data-del-project="' + p.id + '" aria-label="删除项目">' + DELETE_ICON_SVG + '</button>' : '') +
        '</span>'
      );
      html += '<div class="pop-item' + (isActive ? ' active' : '') + '" data-switch-project="' + p.id + '">' +
        nameCell + actions +
        '</div>';
    });
    html += '<div class="pop-divider"></div>';
    html += '<form class="pop-new-form" data-new-project-form><input type="text" placeholder="新建项目名称" data-new-project-input /><button type="submit" aria-label="创建"><svg class="icon icon-sm" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></form>';
    pop.innerHTML = html;

    pop.querySelectorAll('[data-switch-project]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.closest('[data-del-project]') || e.target.closest('[data-rename-project]') || e.target.closest('[data-rename-input]')) return;
        state.currentProjectId = el.getAttribute('data-switch-project');
        state.selectedReqId = mostRecentReqId();
        saveState();
        window.__closePopovers();
        renderTopbarProject(); renderMain(); renderDetail();
      });
    });
    pop.querySelectorAll('[data-del-project]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        var pid = el.getAttribute('data-del-project');
        var proj = state.projects.filter(function (p) { return p.id === pid; })[0];
        showConfirm('删除项目「' + proj.name + '」？', '项目文件夹及全部需求数据将被永久删除，此操作无法撤销。', function () {
          state.projects = state.projects.filter(function (p) { return p.id !== pid; });
          if (state.currentProjectId === pid) state.currentProjectId = state.projects[0].id;
          saveState();
          renderProjectPopover();
          renderTopbarProject(); renderMain(); renderDetail();
        });
      });
    });
    /* 改名：点击改名图标切换成内联输入框，回车/失焦提交，Escape 取消 */
    pop.querySelectorAll('[data-rename-project]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        state.renamingProjectId = el.getAttribute('data-rename-project');
        renderProjectPopover();
        var input = pop.querySelector('[data-rename-input]');
        if (input) { input.focus(); input.select(); }
      });
    });
    pop.querySelectorAll('[data-rename-input]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.stopPropagation(); });
      var commit = function () {
        var pid = el.getAttribute('data-rename-input');
        var proj = state.projects.filter(function (p) { return p.id === pid; })[0];
        var name = el.value.trim();
        if (proj && name) proj.name = name;
        state.renamingProjectId = null;
        saveState();
        renderProjectPopover();
        renderTopbarProject();
      };
      el.addEventListener('blur', commit);
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
        else if (e.key === 'Escape') { state.renamingProjectId = null; renderProjectPopover(); }
      });
    });
    pop.querySelector('[data-new-project-form]').addEventListener('submit', function (e) {
      e.preventDefault();
      var input = pop.querySelector('[data-new-project-input]');
      var name = input.value.trim();
      if (!name) return;
      var proj = { id: uid('proj'), name: name, requirements: [] };
      state.projects.push(proj);
      state.currentProjectId = proj.id;
      state.selectedReqId = null;
      saveState();
      window.__closePopovers();
      renderTopbarProject(); renderMain(); renderDetail();
    });
  }

  /* ================= 正文编辑器：光标记忆 + 插入 + Markdown 式快捷转换 ================= */

  function captureEditorRange(editor) {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return null;
    var range = sel.getRangeAt(0);
    if (!editor.contains(range.commonAncestorContainer)) return null;
    return range.cloneRange();
  }

  /* 模板按钮点击时编辑器已经失焦，选区会被清空，所以插入位置以
     lastEditorRange 为准；如果从来没记录过（比如正文还是空的），
     就退化成插到编辑器末尾，而不是覆盖已有内容 */
  function insertHtmlAtRange(editor, html) {
    editor.focus();
    var range = lastEditorRange;
    var sel = window.getSelection();
    if (range && editor.contains(range.commonAncestorContainer)) {
      sel.removeAllRanges();
      sel.addRange(range);
    } else {
      range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    }
    var frag = range.createContextualFragment(html);
    var lastNode = frag.lastChild;
    range.deleteContents();
    range.insertNode(frag);
    if (lastNode) {
      var after = document.createRange();
      after.setStartAfter(lastNode);
      after.collapse(true);
      sel.removeAllRanges();
      sel.addRange(after);
    }
    lastEditorRange = captureEditorRange(editor);
  }

  /* 输入时的 Markdown 式快捷转换：光标所在行如果以 "## "/"- "/"> " 开头，
     敲完那个空格就把当前行转换成对应的标签，不需要工具栏按钮 */
  function applyMarkdownLiteShortcut(editor) {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || !sel.isCollapsed) return;
    var node = sel.anchorNode;
    if (!node || node.nodeType !== Node.TEXT_NODE) return;
    if (sel.anchorOffset !== node.textContent.length) return;
    var text = node.textContent;
    var convert = null;
    if (/^##\s$/.test(text)) convert = 'h2';
    else if (/^[-*]\s$/.test(text)) convert = 'ul';
    else if (/^>\s$/.test(text)) convert = 'blockquote';
    if (!convert) return;
    /* 第一行在还没按过 Enter 时，文本节点直接挂在编辑器根节点下，没有
       包一层 div/p——这种情况下要连文本节点一起替换，其余情况替换
       文本节点所在的那个块级容器 */
    var target = node.parentElement === editor ? node : node.parentElement;
    var newEl = document.createElement(convert === 'ul' ? 'ul' : convert);
    var inner = convert === 'ul' ? document.createElement('li') : newEl;
    if (convert === 'ul') newEl.appendChild(inner);
    target.replaceWith(newEl);
    var r = document.createRange();
    r.selectNodeContents(inner);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
  }

  function showConfirm(title, body, onConfirm) {
    var wrap = document.createElement('div');
    wrap.className = 'confirm-modal';
    wrap.innerHTML = '<div class="confirm-box"><h4>' + esc(title) + '</h4><p>' + esc(body) + '</p>' +
      '<div class="confirm-actions"><button data-cancel>取消</button><button class="danger" data-confirm>删除</button></div></div>';
    document.body.appendChild(wrap);
    wrap.querySelector('[data-cancel]').addEventListener('click', function () { wrap.remove(); });
    wrap.querySelector('[data-confirm]').addEventListener('click', function () { wrap.remove(); onConfirm(); });
  }

  init();
})();

</script>
</body>
</html>
